<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 60" width="320" height="60" fill="none">
  <!-- Server Chassis Blades -->
  <g id="server-chassis">
    <!-- Top Blade: Light Green -->
    <rect x="0" y="0" width="58" height="16.5" rx="3.5" fill="#9DCF3C" />
    <circle cx="10" cy="8.25" r="4.25" fill="#FFFFFF" />
    <!-- Ventilation matrix dots on Top Blade -->
    <g fill="#FFFFFF" opacity="0.95">
      <circle cx="34" cy="6" r="1.1" />
      <circle cx="38" cy="6" r="1.1" />
      <circle cx="42" cy="6" r="1.1" />
      <circle cx="46" cy="6" r="1.1" />
      <circle cx="50" cy="6" r="1.1" />
      <circle cx="34" cy="10.5" r="1.1" />
      <circle cx="38" cy="10.5" r="1.1" />
      <circle cx="42" cy="10.5" r="1.1" />
      <circle cx="46" cy="10.5" r="1.1" />
      <circle cx="50" cy="10.5" r="1.1" />
    </g>

    <!-- Middle Blade: Cyan -->
    <rect x="0" y="18.5" width="58" height="16.5" rx="3.5" fill="#00ABEB" />
    <circle cx="10" cy="26.75" r="4.25" fill="#FFFFFF" />
    <!-- Dashed/square ventilation on Middle Blade -->
    <g fill="#FFFFFF" opacity="0.95">
      <rect x="34" y="25.75" width="2.2" height="2" rx="0.5" />
      <rect x="38" y="25.75" width="2.2" height="2" rx="0.5" />
      <rect x="42" y="25.75" width="2.2" height="2" rx="0.5" />
      <rect x="46" y="25.75" width="2.2" height="2" rx="0.5" />
      <rect x="50" y="25.75" width="2.2" height="2" rx="0.5" />
    </g>

    <!-- Bottom Blade: Blue/Cyan -->
    <rect x="0" y="37" width="58" height="16.5" rx="3.5" fill="#00AAE8" />
    <circle cx="10" cy="45.25" r="4.25" fill="#FFFFFF" />

    <!-- Padlock Overlaid on Bottom Right -->
    <g id="security-lock" transform="translate(34, 31)">
      <!-- Halo outline for contrast -->
      <path d="M5.5 10 V 5.5 C 5.5 2, 16.5 2, 16.5 5.5 V 10" stroke="#FFFFFF" stroke-width="4.2" fill="none" stroke-linecap="round" />
      <rect x="1.5" y="9" width="19" height="17.5" rx="2.5" fill="#FFFFFF" />
      <!-- Shackle -->
      <path d="M5.5 10 V 5.5 C 5.5 2.5, 16.5 2.5, 16.5 5.5 V 10" stroke="#FFC20E" stroke-width="2.6" fill="none" stroke-linecap="round" />
      <!-- Body -->
      <rect x="2" y="9.5" width="18" height="16.5" rx="2" fill="#FFFFFF" stroke="#FFC20E" stroke-width="2.6" />
      <!-- Keyhole -->
      <circle cx="11" cy="16.5" r="1.8" fill="#FFC20E" />
      <rect x="10.2" y="17" width="1.6" height="3" fill="#FFC20E" />
    </g>
  </g>

  <!-- Brand Typography -->
  <g id="brand-text">
    <text x="70" y="29.5" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" font-size="28" letter-spacing="-0.5" fill="#000000">HOSTMATTIC</text>
    <text x="71" y="52" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="500" font-size="14" letter-spacing="0.1" fill="#636363">Domains, Websites &amp; Hosting</text>
  </g>
</svg>
